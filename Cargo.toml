[package]
name = "openairecorder"
version = "0.4.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tower = { version = "0.5", features = ["util"] }
hound = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
webrtc-vad = "0.4"
pulldown-cmark = "0.13"
egui_commonmark = { version = "0.22", default-features = false, features = ["pulldown_cmark"] }
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "x11"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security", "Win32_Security_Cryptography"] }
cpal = "0.16"
rfd = "0.15"

